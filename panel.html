<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Runable Chat Translator</title>
    <link rel="stylesheet" href="panel.css">
    <script src="panel.js" defer></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A<span>→</span>EN</div>
      <h1>Runable Chat Translator</h1>
      <p class="intro">Read English below the original chat text. Translation runs on your device.</p>

      <label for="source">Chat language</label>
      <select id="source">
        <option value="pt" selected>Portuguese</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
      </select>

      <button id="start" type="button">Translate this chat</button>
      <button id="stop" type="button" hidden>Stop and remove translations</button>

      <p id="status" role="status" aria-live="polite">Open a Runable chat, then select Translate this chat.</p>
      <p class="note">Keep this panel open to translate new messages. The first use may download a language pack in Chrome.</p>
    </main>
  </body>
</html>
